<section class="lp-notfound" aria-labelledby="lp-title">
  <div class="lp-container">
    <p class="lp-notfound-code" aria-hidden="true">404</p>
    <h1 id="lp-title" class="lp-notfound-title">Không tìm thấy trang</h1>
    <p class="lp-subtitle">Trang bạn tìm không tồn tại hoặc đã được đổi địa chỉ.</p>
    <a class="lp-cta" href="{{root}}#lo-trinh">
      <span class="material-symbols-rounded" aria-hidden="true">arrow_back</span>{{shared.backLabel}}
    </a>
  </div>
</section>

<section class="lp-section lp-notfound-list" aria-labelledby="lp-notfound-programs">
  <div class="lp-container">
    <h2 id="lp-notfound-programs" class="lp-section-title">Các chương trình iLEAD</h2>
    <span class="lp-title-deco" aria-hidden="true"></span>
    <ul class="lp-program-links">
      {{#each programs}}
      <li><a href="{{root}}chuong-trinh/{{this.slug}}/"><strong>{{this.name}}</strong><span>{{shared.outcomeLabel}} {{this.referenceOutcome}} – {{shared.frameworkLabel}}</span></a></li>
      {{/each}}
    </ul>
  </div>
</section>
